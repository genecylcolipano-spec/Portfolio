<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
  </noscript>

  <!-- Primary SEO -->
  <title>Genecyl | Front-End Web Developer</title>
  <meta name="description" content="Official website of Genecyl, Front-End Web Developer. I focus on crafting engaging digital experiences and delivering the best solution for every project I take on." />
  <meta name="keywords" content="Genecyl, Front-End Web Developer, React Developer, Portfolio" />
  <meta name="author" content="Genecyl" />

  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://genecyl.com/" />
  <meta property="og:title" content="Genecyl | Front-End Web Developer" />
  <meta property="og:description" content="Official portfolio of Genecyl, Front-End Web Developer." />
  <meta property="og:image" content="https://genecyl.com/Meta.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://genecyl.com/" />
  <meta name="twitter:title" content="Genecyl | Front-End Web Developer" />
  <meta name="twitter:description" content="Official portfolio of Genecyl, Front-End Web Developer." />
  <meta name="twitter:image" content="https://genecyl.com/Meta.jpg" />

  <!-- Canonical -->
  <link rel="canonical" href="https://genecyl.com/" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Genecyl",
    "url": "https://genecyl.com",
    "image": "https://genecyl.com/Photo.jpg",
    "jobTitle": "Front-End Web Developer",
    "description": "I focus on crafting engaging digital experiences and delivering the best solution for every project I take on.",
    "sameAs": [
      "https://www.linkedin.com/in/genecyl/",
      "https://www.instagram.com/genecyl/",
      "https://github.com/genecyl"
    ]
  }
  </script>
</head>

<body>
  <!-- Crawlable text content for SEO -->
  <header style="display:none">
    <h1>Genecyl</h1>
    <p>
      I focus on crafting engaging digital experiences and delivering the best solution for every project I take on.
    </p>
  </header>

  <!-- React root -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
